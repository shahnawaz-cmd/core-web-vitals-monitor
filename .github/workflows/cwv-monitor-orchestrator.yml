name: Core Web Vitals - Orchestrator Run

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * *' # Run daily at 8:00 AM UTC
  workflow_dispatch:

jobs:
  setup:
    name: ⚙️ Setup Matrix Configuration
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Matrix Output
        id: set-matrix
        run: |
          JSON_CONTENT=$(cat sites-matrix.json | tr -d '\n' | tr -d ' ')
          echo "matrix=${JSON_CONTENT}" >> $GITHUB_OUTPUT

  audit-and-deploy:
    name: ⚡ Audit ${{ matrix.site.id }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Clean Temporary Results Directory
        run: |
          rm -rf reports/temp-results
          mkdir -p reports/temp-results

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Core Web Vitals Tests
        env:
          TARGET_DOMAIN: "${{ matrix.site.url }}"
          DOMAIN_ID: "${{ matrix.site.id }}"
        run: |
          npm run test:cwv -- --project=desktop-chrome --project=mobile-chrome

      - name: Run Diagnostics Spec
        env:
          TARGET_DOMAIN: "${{ matrix.site.url }}"
          DOMAIN_ID: "${{ matrix.site.id }}"
        run: |
          npx playwright test tests/diagnostic-audit.spec.js --project=desktop-chrome --project=mobile-chrome
        continue-on-error: true

      - name: Run PageSpeed Insights Audit
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          TARGET_DOMAIN: "${{ matrix.site.url }}"
          DOMAIN_ID: "${{ matrix.site.id }}"
        run: |
          node scripts/pagespeed-audit.js
        continue-on-error: true

      - name: Generate Reports
        run: |
          node scripts/generate-report.js
          node scripts/generate-diagnostic-report.js
          npm run report:portal

      - name: Deploy Consolidated Report to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: ${{ matrix.site.id }} # Deploy reports to site subfolders e.g. /detailedvehiclehistory
          keep_files: true
          allow_empty_commit: true

      - name: Deploy Index Portal Page to Root Directory
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: . # Deploy index.html directly to root folder
          keep_files: true
          allow_empty_commit: true

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.site.id }}
        run: |
          node scripts/slack-notifier.js
