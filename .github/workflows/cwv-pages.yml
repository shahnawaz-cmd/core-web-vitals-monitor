name: Core Web Vitals CI & Deploy

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * *' # Run daily at 8:00 AM UTC
  workflow_dispatch: # Enable manual run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Core Web Vitals Tests
        run: |
          npm run test:cwv -- --project=desktop-chrome --project=mobile-chrome

      - name: Run Diagnostics Spec
        run: |
          npx playwright test tests/diagnostic-audit.spec.js --project=desktop-chrome --project=mobile-chrome
        continue-on-error: true

      - name: Generate Reports
        run: |
          node scripts/generate-report.js
          node scripts/generate-diagnostic-report.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: reports # Deploys the reports directory directly
          branch: gh-pages

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          node scripts/slack-notifier.js
